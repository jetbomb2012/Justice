<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manus 古堡・迎接儀式 + 電影展</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: radial-gradient(1200px 600px at 50% -10%, #121820 0%, #0b0f14 60%) fixed;
      color: #e6e6e6;
      font-family: "Noto Sans TC", sans-serif;
    }
    header {
      padding: 20px 24px;
      border-bottom: 1px solid #1b2430;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.2));
      backdrop-filter: blur(6px);
    }
    .title {
      font-family: "Cinzel", serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.6px;
    }
    main {
      padding: 48px 24px;
      display: grid;
      place-items: center;
    }
    .hero {
      max-width: 980px;
      width: 100%;
      border: 1px solid #1b2430;
      border-radius: 16px;
      padding: 40px 32px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.25));
      box-shadow: 0 24px 60px -30px rgba(0,0,0,0.6);
      text-align: center;
      margin-bottom: 40px;
    }
    .hero h1 {
      font-family: "Cinzel", serif;
      font-size: clamp(28px, 4.5vw, 48px);
      margin-bottom: 12px;
      background: linear-gradient(180deg, #fff, #cfcfcf 60%, #9aa3ad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero p {
      font-size: 16px;
      color: #9aa3ad;
    }
    .player-box {
      width: 420px;
      height: 420px;
      border-radius: 50%;
      margin: 40px auto;
      background: radial-gradient(circle at center, #88f 30%, #000 100%);
      box-shadow: 0 0 40px rgba(0, 200, 255, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-align: center;
      padding: 10px;
    }
    h2 {
      margin: 10px 0;
      font-size: 16px;
      color: #ffdc00;
    }
    video {
      width: 95%;
      height: 95%;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(255,255,255,0.5);
    }
    footer {
      padding: 20px;
      text-align: center;
      font-size: 14px;
      color: #9aa3ad;
      border-top: 1px solid #1b2430;
    }
  </style>
</head>
<body>
  <header>
    <div class="title">Manus 古堡迎接儀式</div>
  </header>

  <main>
    <section class="hero">
      <h1>歡迎進入古堡</h1>
      <p>這裡是進註儀式的起點，所有事件都將被封存為 Doctrine。</p>
    </section>

    <section class="hero">
      <h1>古堡電影展區</h1>
      <p>水晶球框將隨機輪播影片，每一部都是一次見證。</p>

      <div class="player-box">
        <h2 id="info"></h2>
        <video id="autoVideo" controls autoplay muted>
          <source id="videoSource" src="" type="video/mp4">
          您的瀏覽器不支援影片播放
        </video>
      </div>
    </section>
  </main>

  <footer>
    © 2026 Manus Castle. 所有影像皆為 Doctrine 封存節點。
  </footer>

  <script>
    const totalVideos = 40;
    const video = document.getElementById("autoVideo");
    const source = document.getElementById("videoSource");

    function getRandomIndex(exclude) {
      let idx;
      do {
        idx = Math.floor(Math.random() * totalVideos) + 1;
      } while (idx === exclude);
      return idx;
    }

    function playVideo(index) {
      const file = `foxokiso-C3-${index}.mp4`;
      source.src = file;
      video.load();
      video.play().catch(err => console.log("播放失敗:", err));
      document.getElementById("info").innerText =
        `現在播放的是第 ${index} 部影片：${file}`;
    }

    let currentIndex = 1;
    playVideo(currentIndex);

    video.addEventListener("ended", () => {
      currentIndex = getRandomIndex(currentIndex);
      playVideo(currentIndex);
    });
  </script>
</body>
</html>
