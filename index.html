<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manus 古堡・迎接儀式</title>
  <meta name="description" content="Manus 古堡入口・迎接進註儀式頁" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f14;
      --bg-alt: #0f141b;
      --text: #e6e6e6;
      --muted: #9aa3ad;
      --accent: #c79a3b;
      --accent-2: #7aa6ff;
      --border: #1b2430;
      --glow: rgba(199, 154, 59, 0.25);
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      background: radial-gradient(1200px 600px at 50% -10%, #121820 0%, var(--bg) 60%) fixed;
      color: var(--text);
      margin: 0;
      font-family: "Noto Sans TC", system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    .wrap {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    header {
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.2));
      backdrop-filter: blur(6px);
    }
    .brand {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .crest {
      width: 44px; height: 44px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background:
        radial-gradient(60% 60% at 50% 40%, rgba(199,154,59,0.15), transparent 60%),
        linear-gradient(135deg, rgba(122,166,255,0.12), rgba(0,0,0,0.2));
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03) inset, 0 8px 24px -12px var(--glow);
    }
    .title {
      font-family: "Cinzel", serif;
      letter-spacing: 0.6px;
      font-size: 20px;
      font-weight: 700;
    }
    .subtitle {
      color: var(--muted);
      font-size: 13px;
    }
    main {
      display: grid;
      place-items: center;
      padding: 48px 24px;
    }
    .hero {
      max-width: 980px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      background:
        radial-gradient(800px 400px at 20% 0%, rgba(122,166,255,0.06), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.25));
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 24px 60px -30px rgba(0,0,0,0.6),
        0 12px 36px -18px var(--glow);
      text-align: center;
    }
    .hero h1 {
      font-family: "Cinzel", serif;
      font-size: clamp(28px, 4.5vw, 48px);
      line-height: 1.15;
      margin: 0 0 12px;
      background: linear-gradient(180deg, #fff, #cfcfcf 60%, #9aa3ad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 1px 0 rgba(255,255,255,0.05);
    }
    .hero p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 16px;
    }
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 24px 0;
    }
    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--border);
      color: var(--text);
      background:
        radial-gradient(120% 120% at 50% 0%, rgba(199,154,59,0.18), rgba(0,0,0,0.35)),
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.35));
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
      box-shadow: 0 10px 24px -12px var(--glow);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .btn:hover {
      transform: translateY(-1px);
      border-color: #2a3646;
      box-shadow: 0 16px 36px -16px var(--glow);
    }
    .btn .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(199,154,59,0.15);
    }
    .btn.secondary {
      background:
        radial-gradient(120% 120% at 50% 0%, rgba(122,166,255,0.18), rgba(0,0,0,0.35)),
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.35));
    }
    .note {
      color: var(--muted);
      font-size: 13px;
    }
    footer {
      border-top: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(255,255,255,0.02));
    }
    .foot {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 24px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
    }
    .links {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .links a {
      color: var(--accent-2);
      text-decoration: none;
      border-bottom: 1px dashed rgba(122,166,255,0.35);
    }
    .links a:hover {
      color: #9fc0ff;
      border-bottom-color: rgba(122,166,255,0.6);
    }

    /* 水晶球播放器樣式 */
    .player-box {
      width: 420px;
      height: 420px;
      border-radius: 50%;
      margin: 40px auto;
      background: radial-gradient(circle at center, #88f 30%, #000 100%);
      box-shadow: 0 0 40px rgba(0, 200, 255, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
